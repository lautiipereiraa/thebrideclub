# valen · compose de DESARROLLO (el único que existe hoy).
#   docker compose up -d --build
#
# Monolito Next.js + Postgres. No hay backend aparte: la app habla con la base
# desde Server Components y Server Actions. La base guarda las consultas que
# llegan por el formulario de cotizacion.
#
# Se llega de dos formas:
#   1. https://tesis.148-113-167-40.sslip.io → por Traefik, puerto 443, con
#      certificado válido. Es la que usa Valen: 443 pasa en cualquier red, los
#      puertos altos no siempre. sslip.io resuelve solo a la IP del server, así
#      que no hace falta tocar DNS ni el dominio usdzhin.com.ar.
#   2. http://148.113.167.40:3005 → puerto publicado directo. Sirve para probar
#      desde el propio server; desde afuera puede venir filtrado.

name: valen-dev

services:
  web:
    image: valen-web-dev
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: valen-web
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://valen:${POSTGRES_PASSWORD}@db:5432/valen
      # Usuario y clave para entrar a /consultas (el panel privado de Valen).
      CONSULTAS_USER: ${CONSULTAS_USER}
      CONSULTAS_PASSWORD: ${CONSULTAS_PASSWORD}
      # Orígenes extra que el dev server de Next acepta (IP o dominio del
      # servidor). Va por entorno para no hardcodear la infra en el repo.
      EXTRA_DEV_ORIGINS: ${EXTRA_DEV_ORIGINS:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3005}:3000"
    networks: [default, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.valen.entrypoints: websecure
      # Dos escrituras del mismo nombre: con guiones y con puntos. sslip.io acepta
      # las dos, y la del medio (puntos) es la que sale natural al copiar una IP.
      # Si el cert no cubre la que se tipeo, el navegador la bloquea con la pantalla
      # roja de "conexion no privada" — por eso van ambas en la regla.
      traefik.http.routers.valen.rule: Host(`${PUBLIC_HOST:-tesis.148-113-167-40.sslip.io}`) || Host(`${PUBLIC_HOST_ALT:-tesis.148.113.167.40.sslip.io}`)
      traefik.http.routers.valen.tls: "true"
      traefik.http.routers.valen.tls.certresolver: le
      traefik.http.services.valen.loadbalancer.server.port: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: valen-db
    environment:
      POSTGRES_USER: valen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: valen
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin `ports`: la base no se publica al host ni a internet. Solo la alcanza
    # el servicio `web`, por la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valen -d valen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  node_modules:
    name: valen-node-modules
  db_data:
    name: valen-db-data
