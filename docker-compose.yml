# thebrideclub · compose de DESARROLLO.
#   docker compose up -d --build
#
# Monolito Next.js + Postgres. No hay backend aparte: la app habla con la base
# desde Server Components y Server Actions. La base guarda las consultas que
# llegan por el formulario de cotizacion.
#
# Producción vive aparte, en ~/prod/thebrideclub (https://thebrideclub.com.ar), y corre
# la imagen `runner` buildeada desde acá. Este stack es el de desarrollo.
#
# Se llega de dos formas:
#   1. https://dev.thebrideclub.com.ar → por Traefik, puerto 443, con
#      certificado válido. Es la que usa Valen.
#   2. http://148.113.167.40:3005 → puerto publicado directo. Sirve para probar
#      desde el propio server; desde afuera puede venir filtrado.

name: thebrideclub-dev

services:
  web:
    image: thebrideclub-web-dev
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: thebrideclub-web
    # Tope de RAM (2026-10-13): el dev server de Turbopack acumula cache y no la
    # libera; sin tope llego a 1.8 GB en 5 dias. Sin swap extra para que no lo
    # esquive paginando. Si lo supera, el kernel lo mata y `restart` lo levanta.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://thebrideclub:${POSTGRES_PASSWORD}@db:5432/thebrideclub
      # Usuario y clave para entrar a /consultas (el panel privado de Valen).
      CONSULTAS_USER: ${CONSULTAS_USER}
      CONSULTAS_PASSWORD: ${CONSULTAS_PASSWORD}
      # Orígenes extra que el dev server de Next acepta (IP o dominio del
      # servidor). Va por entorno para no hardcodear la infra en el repo.
      EXTRA_DEV_ORIGINS: ${EXTRA_DEV_ORIGINS:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3005}:3000"
    networks: [default, edge]
    labels:
      # Los nombres llevan sufijo -dev porque el stack de produccion
      # (~/prod/thebrideclub) publica los suyos como `thebrideclub`. Dos contenedores
      # declarando el MISMO nombre de router hacen que Traefik descarte los dos
      # ("defined multiple times with different configurations").
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.thebrideclub-dev.entrypoints: websecure
      traefik.http.routers.thebrideclub-dev.rule: Host(`${PUBLIC_HOST:?definir PUBLIC_HOST en .env}`)
      traefik.http.routers.thebrideclub-dev.tls: "true"
      traefik.http.routers.thebrideclub-dev.tls.certresolver: le
      traefik.http.services.thebrideclub-dev.loadbalancer.server.port: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: thebrideclub-db
    environment:
      POSTGRES_USER: thebrideclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thebrideclub
    volumes:
      - db_data:/var/lib/postgresql/data
    # Sin `ports`: la base no se publica al host ni a internet. Solo la alcanza
    # el servicio `web`, por la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebrideclub -d thebrideclub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  node_modules:
    name: thebrideclub-node-modules
  db_data:
    name: thebrideclub-db-data
